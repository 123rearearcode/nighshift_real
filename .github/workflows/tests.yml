name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_diagnostics:
        description: Run the complete brush/angle/paste matrix and frame measurements
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the project folder
        run: |
          PROJECT_FILE=$(find . -name project.godot -not -path './.git/*' | head -n 1)
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Project hygiene and CI scope tests
        run: |
          cd "$PROJECT_DIR"
          python3 -I tools/check_project.py
          python3 -B tools/test_ci_scope.py

      - name: Choose verification scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ inputs.full_diagnostics || false }}
          CI_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd "$PROJECT_DIR"
          python3 -I tools/ci_scope.py

      - name: Download Godot
        if: steps.scope.outputs.runtime == 'true'
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        if: steps.scope.outputs.runtime == 'true'
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --import

      - name: Required test suites
        if: steps.scope.outputs.runtime == 'true'
        run: |
          cd "$PROJECT_DIR"
          SUITES="test_data_schemas|Data schema
          test_regressions|Regression
          test_start_screen|Start screen
          test_dust_flow|Dust flow
          test_bench_interactions|Bench interaction
          test_bench_feedback|Bench feedback
          test_audio_and_vacuum|Audio and vacuum"
          bad=0
          while IFS='|' read -r file name; do
            file="$(echo "$file" | xargs)"
            log="$GITHUB_WORKSPACE/$file.log"
            echo "::group::$name ($file.gd)"
            if godot --headless --path . --script "res://tools/$file.gd" 2>&1 | tee "$log"; then :; else bad=1; fi
            echo "::endgroup::"
            if ! grep -q "$name checks: .*failures: 0" "$log"; then echo "::error::$name failed or printed no summary"; bad=1; fi
            if grep -qE "SCRIPT ERROR|Parse Error" "$log"; then echo "::error::$name had a script error"; bad=1; fi
            grep -E "checks: [0-9]+, failures: [0-9]+" "$log" | tail -1 || true
          done <<< "$SUITES"
          exit $bad

      - name: Known defects (non-blocking until Claude fixes the bench)
        if: steps.scope.outputs.runtime == 'true'
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          echo "Known D57 lever bypass and rejected-tool highlight defects; see docs/TESTING.md." >> "$GITHUB_STEP_SUMMARY"
          godot --headless --path . --script res://tools/test_pending_contracts.gd 2>&1 | tee "$GITHUB_WORKSPACE/pending-contracts.log"

      - name: Code style report (non-blocking backlog)
        if: steps.scope.outputs.runtime == 'true'
        continue-on-error: true
        run: |
          pip install --quiet "gdtoolkit==4.*"
          cd "$PROJECT_DIR"
          gdlint scripts tools 2>&1 | tee "$GITHUB_WORKSPACE/gdlint.log"

      - name: Scripted diagnostics (smoke or full matrix; non-blocking)
        if: steps.scope.outputs.runtime == 'true'
        continue-on-error: true
        env:
          FULL_DIAGNOSTICS: ${{ steps.scope.outputs.full }}
        run: |
          cd "$PROJECT_DIR"
          mode_args=(--smoke)
          limit=120
          if [ "$FULL_DIAGNOSTICS" = "true" ]; then mode_args=(); limit=540; fi
          timeout "$limit" godot --headless --path . --script res://tools/playtest_bench.gd -- "${mode_args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/playtest.log"
          grep -q "Playtest finished" "$GITHUB_WORKSPACE/playtest.log"
          ! grep -qE "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/playtest.log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"
          if-no-files-found: ignore
