# Runs the project checks on every push and pull request, using the real engine version.
# Written without being able to run it: if the first run is red, read the log before assuming
# the game is broken, the workflow itself may need a small fix.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        # Works whether the files sit at the top of the repository or inside one extra folder.
        run: |
          PROJECT_FILE=$(find . -name project.godot -not -path './.git/*' | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "No project.godot found anywhere in the repository. The project files were not uploaded. Top of the repository:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          ls -la "$DIR"
          if [ ! -f "$DIR/tools/check_project.py" ]; then
            echo "The tools folder is missing from the project. Upload the tools folder too."
            exit 1
          fi

      - name: Project hygiene (versions, changelog, file map)
        run: |
          cd "$PROJECT_DIR"
          python3 -I tools/check_project.py

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project (builds the .godot cache)
        # Only preparation. The test steps below decide pass or fail, so a quirky exit code here is ignored.
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --import || true

      - name: Data schema checks
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_data_schemas.gd 2>&1 | tee "$GITHUB_WORKSPACE/schema.log"
          grep -q "Data schema checks: .*failures: 0" "$GITHUB_WORKSPACE/schema.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/schema.log"

      - name: Regression suite
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_regressions.gd 2>&1 | tee "$GITHUB_WORKSPACE/regression.log"
          grep -q "Regression checks: .*failures: 0" "$GITHUB_WORKSPACE/regression.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/regression.log"

      - name: Start screen and save navigation
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_start_screen.gd 2>&1 | tee "$GITHUB_WORKSPACE/start-screen.log"
          grep -q "Start screen checks: .*failures: 0" "$GITHUB_WORKSPACE/start-screen.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/start-screen.log"

      - name: First-entry dust, transport and movable clamp
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_dust_flow.gd 2>&1 | tee "$GITHUB_WORKSPACE/dust-flow.log"
          grep -q "Dust flow checks: .*failures: 0" "$GITHUB_WORKSPACE/dust-flow.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/dust-flow.log"

      - name: Put-down pickup and component access
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_bench_interactions.gd 2>&1 | tee "$GITHUB_WORKSPACE/bench-interactions.log"
          grep -q "Bench interaction checks: .*failures: 0" "$GITHUB_WORKSPACE/bench-interactions.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/bench-interactions.log"

      - name: Trapped tails, clamp drag and cooler put-down
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --script res://tools/test_bench_feedback.gd 2>&1 | tee "$GITHUB_WORKSPACE/bench-feedback.log"
          grep -q "Bench feedback checks: .*failures: 0" "$GITHUB_WORKSPACE/bench-feedback.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$GITHUB_WORKSPACE/bench-feedback.log"

      - name: Scripted bench playtest (prints a table, never fails the build)
        if: always()
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          timeout 300 godot --headless --path . --script res://tools/playtest_bench.gd 2>&1 | tee "$GITHUB_WORKSPACE/playtest.log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"
